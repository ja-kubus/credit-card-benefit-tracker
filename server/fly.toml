# Fly.io configuration for the linking backend.
#
# STATELESS: this app keeps no database and no disk state — the app-user ->
# Stripe-customer mapping lives in Stripe (customer metadata). So there is no
# volume to attach and machines can be scaled freely.
#
# Change `app` to your chosen unique name (or let `fly launch` set it), then set
# your primary region below.

app = "credit-card-benefit-backend"        # <-- change to your unique app name
primary_region = "iad"                      # <-- e.g. iad (US East), sea, lhr...

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Idle machines when there's no traffic; they wake on the next request.
  # Stateless, so scaling out is safe if you ever need it.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
